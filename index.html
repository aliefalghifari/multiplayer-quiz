<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Battle Quiz Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2> FastAPI Based Quiz </h2>

    <!-- screen 1: lobby -->
   <div id="screen-lobby">
      <input type="text" id="username" placeholder="Nama anda..." class="username"><br><br>
      <button class="btn" onclick="findMatch()" id="btn-find">Cari Lawan</button>
      <p id="status" class="status">Masukkan nama untuk memulai</p>
    </div>

    <!-- screen 2: game interface -->
    <div id="screen-game" class="hidden">
      <h3 id="q-text"></h3>
      <div id="opts"></div>
      <div id="timer" class="timer">Time Elapsed: 0</div>
    </div>

    <!-- screen 3: game result -->
    <div id="screen-result" class="hidden"> 
      <h3 id="res-title">Game Selesai!</h3>
      <p id="res-text" class="result-score"></p>
      <div id="timer" class="timer">Waktu: 0 detik</div>
      <button class="btn" onclick="location.reload()">Main Lagi</button>
    </div>
  </div>

  <script src="script.js"></script>
  <!-- <script src="devmode1.js"></script> -->
  <!-- <script src="devmode2.js"></script> -->
</body>
</html>
